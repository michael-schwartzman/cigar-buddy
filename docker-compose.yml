version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: cigar-buddy-postgres
    restart: always
    environment:
      POSTGRES_DB: cigar_buddy_dev
      POSTGRES_USER: cigar_user
      POSTGRES_PASSWORD: cigar_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cigar_user -d cigar_buddy_dev"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: cigar-buddy-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:
